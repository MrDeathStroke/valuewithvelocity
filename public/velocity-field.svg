<?xml version="1.0" encoding="UTF-8"?>
<!--
  VWV Logo — VELOCITY FIELD · MASTER
  The canonical brand mark. Uses currentColor so it adapts to any
  context. V silhouette filled with seven horizontal lines that
  accelerate top-to-bottom (weight 1.5 → 4).

  Brand: VWV — Value With Velocity
  Tagline: Measurable value, engineered in weeks.
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VWV — Value With Velocity">
  <defs>
    <clipPath id="vf-mask">
      <path d="M 14 16 L 50 82 L 86 16 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#vf-mask)" stroke="currentColor" stroke-linecap="square">
    <line x1="0" y1="24" x2="100" y2="24" stroke-width="1.5"/>
    <line x1="0" y1="33" x2="100" y2="33" stroke-width="2"/>
    <line x1="0" y1="42" x2="100" y2="42" stroke-width="2.5"/>
    <line x1="0" y1="51" x2="100" y2="51" stroke-width="3"/>
    <line x1="0" y1="60" x2="100" y2="60" stroke-width="3.5"/>
    <line x1="0" y1="69" x2="100" y2="69" stroke-width="4"/>
    <line x1="0" y1="78" x2="100" y2="78" stroke-width="4"/>
  </g>
</svg>
