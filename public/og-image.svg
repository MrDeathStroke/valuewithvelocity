<?xml version="1.0" encoding="UTF-8"?>
<!--
  VWV Open Graph Image — 1200×630
  For social sharing (LinkedIn, X, Slack, etc.).
  Deep Navy canvas with Cobalt Velocity Field + wordmark + tagline.

  To export as PNG: open in a browser, use a screenshot tool, or use
  any SVG-to-PNG converter (cairosvg, Inkscape, Figma export).
-->
<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VWV — Value With Velocity">
  <!-- Deep Navy canvas -->
  <rect x="0" y="0" width="1200" height="630" fill="#0F172A"/>

  <!-- Velocity Field icon (left) -->
  <defs>
    <clipPath id="og-mask">
      <path d="M 130 184 L 230 367 L 330 184 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#og-mask)" stroke="#2563EB" stroke-linecap="square">
    <line x1="60" y1="206" x2="400" y2="206" stroke-width="5"/>
    <line x1="60" y1="232" x2="400" y2="232" stroke-width="7"/>
    <line x1="60" y1="258" x2="400" y2="258" stroke-width="9"/>
    <line x1="60" y1="284" x2="400" y2="284" stroke-width="11"/>
    <line x1="60" y1="310" x2="400" y2="310" stroke-width="13"/>
    <line x1="60" y1="336" x2="400" y2="336" stroke-width="15"/>
    <line x1="60" y1="362" x2="400" y2="362" stroke-width="15"/>
  </g>

  <!-- Wordmark + tagline (right) -->
  <text x="460" y="280"
    font-family="Space Grotesk, ui-sans-serif, sans-serif"
    font-weight="700"
    font-size="140"
    letter-spacing="-6"
    fill="#F5F4EF">VWV</text>

  <text x="464" y="335"
    font-family="Space Grotesk, ui-sans-serif, sans-serif"
    font-weight="500"
    font-size="28"
    letter-spacing="-0.5"
    fill="#2563EB">Measurable value, engineered in weeks.</text>

  <text x="464" y="372"
    font-family="Geist Mono, ui-monospace, monospace"
    font-weight="400"
    font-size="14"
    letter-spacing="3"
    fill="#94A3B8">VALUE WITH VELOCITY · VWV.AGENCY</text>

  <!-- Bottom-right meta -->
  <text x="1140" y="600"
    text-anchor="end"
    font-family="Geist Mono, ui-monospace, monospace"
    font-weight="400"
    font-size="11"
    letter-spacing="2.5"
    fill="#64748B">VWV © 2026 · BUILT FOR VELOCITY</text>
</svg>
